[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-standards"
version = "0.1.0"
description = "repository for scripts and standards for building a project & repo scaffolding"
readme = "README.md"
requires-python = ">=3.11"
# license = { text = "MIT" }
# authors = [
#   { name = "Paul Drangeid", email = "pdrangeid@gmail.com" },
# ]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Add further runtime dependencies here, e.g.:
    # "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "pip-tools",
    # "python-dotenv",
    # "mypy",
]

[project.scripts]
dev-standards = "dev_standards.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["dev_standards*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=dev_standards --cov-report=html --cov-report=xml"
testpaths = ["tests"]
python_files = "test_*.py *_test.py tests.py"
